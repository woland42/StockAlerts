name: Check Stock Alerts

on:
  schedule:
    - cron: "0 7,11 * * 1-5"   # 8:00 AM and 12:00 PM UK time (7:00 and 11:00 UTC)
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Set to "true" to force a test notification'
        required: false
        default: 'false'

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert checker
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          FORCE_ALERT: ${{ github.event.inputs.test_alert }}
        run: python check_alerts.py
